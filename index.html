<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<meta name="robots" content="noindex">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>EZE Gestão Protótipo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: escritório virtual — cabeçalho fixo, telas em coluna larga, sala em planta baixa com paredes pretas; preto e branco */
:root{
  --bg:#FFFFFF; --fg:#111111; --muted:#5C5C58; --line:#E3E3DF; --soft:#F4F4F1; --inv-bg:#111111; --inv-fg:#FFFFFF; --faint:#7A7A75;
  --body:'Plus Jakarta Sans','Helvetica Neue',Arial,sans-serif;
  --mono:'Plus Jakarta Sans','Helvetica Neue',Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
a{color:var(--fg)}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.wrap{max-width:1320px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mono{font-family:var(--body);font-size:12px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.brand-sub{font-size:11px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.menu-btn{display:none;min-height:44px;padding:0 16px;border:1px solid var(--fg);background:var(--bg);font-weight:500;cursor:pointer}
.drawer{border-top:1px solid var(--line);padding-block:16px 24px;display:flex;flex-direction:column;gap:14px}
.drawer .search input{width:100%}.drawer .search{width:100%}.drawer .role{align-self:flex-start}
.drawer a.dl{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--line);text-decoration:none;font-size:19px;font-weight:500;color:var(--muted)}
.drawer a.dl.on{color:var(--fg)}
.tabbar{display:none}
h1,h2,h3{text-wrap:balance;margin:0}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--fg)}
.top-in{display:flex;flex-wrap:wrap;align-items:center;gap:8px 24px;padding-block:12px}
.brand{display:flex;align-items:baseline;gap:10px;text-decoration:none}
.brand b{font-weight:800;font-size:22px;letter-spacing:.04em}
.nav{display:flex;flex-wrap:wrap;gap:0 20px;flex:1;min-width:0}
.nav a{text-decoration:none;color:var(--muted);padding:10px 0;font-size:15px;border-bottom:2px solid transparent;display:flex;align-items:center;gap:6px}
.nav a.on{color:var(--fg);border-color:var(--fg);font-weight:500}
.badge{font-family:var(--mono);font-size:11px;background:var(--inv-bg);color:var(--inv-fg);padding:0 6px}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.search{display:flex;border:1px solid var(--fg)}
.search input{border:0;background:transparent;padding:8px 10px;width:150px;min-width:0}
.search button{border:0;border-left:1px solid var(--fg);background:transparent;padding:0 10px;cursor:pointer}
.role{display:flex;border:1px solid var(--fg)}
.role button{border:0;background:transparent;padding:8px 12px;cursor:pointer;font-size:13px}
.role button.on{background:var(--inv-bg);color:var(--inv-fg)}
main{padding-block:36px 96px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:46px;padding:0 20px;border:1px solid var(--fg);background:var(--bg);color:var(--fg);cursor:pointer;text-decoration:none;font-weight:500;font-size:15px}
.btn.dark{background:var(--inv-bg);color:var(--inv-fg)}
.btn.small{min-height:36px;padding:0 12px;font-size:13px}
.btn[disabled]{border-style:dashed;color:var(--muted);cursor:not-allowed;background:var(--bg)}
.row{display:flex;flex-wrap:wrap;gap:16px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:24px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:20px}
.box{border:1px solid var(--fg);padding:24px}
.soft{background:var(--soft);padding:20px}
.list>*{border-top:1px solid var(--line)}
.list>*:last-child{border-bottom:1px solid var(--line)}
.err{font-size:14px;font-weight:500;margin:8px 0 0}
.bar{height:4px;background:var(--line)}.bar>i{display:block;height:100%;background:var(--fg)}
.pill{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--fg);padding:2px 8px;white-space:nowrap;display:inline-block}
.pill{align-self:flex-start}
.pill.inv{background:var(--inv-bg);color:var(--inv-fg)}
.pill.dash{border-style:dashed;color:var(--muted);border-color:var(--muted)}
.h-xl{font-size:clamp(40px,6vw,80px);font-weight:800;letter-spacing:-.03em;line-height:1}
.h-l{font-size:clamp(30px,4vw,52px);font-weight:800;letter-spacing:-.025em;line-height:1.02}
.h-m{font-size:24px;font-weight:600;letter-spacing:-.01em;line-height:1.2}
.lead{font-size:18px;color:var(--muted);max-width:62ch}
.prose{max-width:68ch}
.prose ol{padding-left:22px;display:flex;flex-direction:column;gap:8px}
.tabs{display:flex;flex-wrap:wrap;gap:8px}
.tabs button{min-height:42px;padding:0 16px;border:1px solid var(--fg);background:var(--bg);cursor:pointer}
.tabs button.on{background:var(--inv-bg);color:var(--inv-fg)}
.aside-list button{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--line);padding:13px 0;cursor:pointer;font-size:15px}
.aside-list button.on{background:var(--inv-bg);color:var(--inv-fg);padding-inline:12px;margin-inline:-12px;width:calc(100% + 24px);border-color:transparent}
.aside-list button[disabled]{color:var(--faint);cursor:not-allowed}
.video{aspect-ratio:16/9;max-width:100%;background:#0B0B0A;color:#FFFFFF;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;position:relative}
.video .play{width:72px;height:72px;border-radius:50%;border:1.5px solid #FFFFFF;background:transparent;color:#FFFFFF;cursor:pointer;display:flex;align-items:center;justify-content:center}
.video .vbar{position:absolute;left:0;right:0;bottom:0;height:5px;background:#3A3A38}.video .vbar i{display:block;height:100%;background:#FFFFFF}
.opt{display:flex;gap:14px;align-items:center;width:100%;text-align:left;min-height:54px;padding:10px 16px;border:1px solid var(--line);background:var(--bg);cursor:pointer;font-size:16px}
.opt.sel{border:2px solid var(--fg);background:var(--soft)}
.opt.ok{border:2px solid var(--fg);background:var(--inv-bg);color:var(--inv-fg)}
.opt.no{border:2px dashed var(--fg)}
.chk{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.chk input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--fg);flex:none}
textarea,input[type=text],input[type=password],input[type=file],select.f{width:100%;border:1px solid var(--fg);background:var(--bg);padding:10px 12px}
label.l{display:block;font-size:14px;font-weight:500;margin-bottom:6px}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:720px;font-size:15px}
th{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:left;font-weight:400;padding:10px 12px;border-bottom:1px solid var(--fg)}
td{padding:14px 12px;border-bottom:1px solid var(--line);vertical-align:top;font-variant-numeric:tabular-nums}
.block{border:1px solid var(--line);padding:16px;display:flex;flex-direction:column;gap:10px}
.block-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.icon-btns{display:flex;gap:6px}
.icon-btns button{width:36px;height:36px;border:1px solid var(--line);background:var(--bg);cursor:pointer}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--inv-bg);color:var(--inv-fg);padding:14px 20px;font-size:15px;z-index:50;max-width:calc(100% - 32px)}
.layout-aula,.layout-sala{display:flex;flex-wrap:wrap;gap:32px 48px;align-items:flex-start}
.layout-aula aside{flex:1 1 250px;max-width:320px;border-top:1px solid var(--fg);padding-top:20px}
.layout-aula .main,.layout-sala .main{flex:999 1 560px;min-width:0}
.layout-sala aside{flex:1 1 280px;max-width:380px;display:flex;flex-direction:column;gap:20px}
.note{font-size:13px;color:var(--muted)}
.planta-scroll{overflow-x:auto}
.planta{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));grid-template-rows:repeat(3,minmax(170px,auto));gap:8px;padding:8px;background:var(--fg);min-width:640px}
.amb{background:var(--bg);padding:14px;display:flex;flex-direction:column;gap:10px;justify-content:space-between}
.amb.aqui{background:var(--soft);outline:3px solid var(--fg);outline-offset:-3px}
.amb h3{font-size:16px;font-weight:600}
.amb.proj{background:repeating-linear-gradient(135deg,var(--line) 0 1px,var(--bg) 1px 10px)}
.amb.proj .tag{background:var(--bg);align-self:flex-start;padding:0 4px}
.avs{display:flex;flex-wrap:wrap;gap:6px}
.av{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--fg);background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;position:relative;cursor:pointer;padding:0}
.av.eu{background:var(--inv-bg);color:var(--inv-fg)}
.av .st{position:absolute;right:-2px;bottom:-2px;width:12px;height:12px;border-radius:50%;border:2px solid var(--bg)}
.st-disp{background:var(--fg)}.st-foco{background:var(--bg);box-shadow:inset 0 0 0 2px var(--fg)}.st-reun{background:repeating-linear-gradient(90deg,var(--fg) 0 50%,var(--bg) 50% 100%)}
.sev{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.08em;width:56px;flex:none}
.score{font-size:64px;font-weight:800;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.rub{display:grid;grid-template-columns:minmax(0,1fr) 180px 36px;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.rub input[type=range]{width:100%;accent-color:var(--fg)}
header.top{border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:32px;min-height:60px;padding-block:0;flex-wrap:nowrap}
.nav{gap:0 4px;flex:1}
.nav a{height:60px;padding:0 12px;font-size:14px;border:0;color:var(--muted);position:relative}
.nav a.on{color:var(--fg);font-weight:600}
.nav a.on::after{content:"";position:absolute;left:12px;right:12px;bottom:-1px;height:2px;background:var(--fg)}
.nav a:hover{color:var(--fg)}
.cnt{font-size:10px;font-weight:600;background:var(--fg);color:var(--bg);border-radius:8px;min-width:16px;height:16px;line-height:16px;text-align:center;padding:0 4px;margin-left:6px}
.hd-ic{display:flex;align-items:center;gap:4px;margin-left:auto}
.icon-b{width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;border:0;background:none;position:relative;color:var(--fg);cursor:pointer;text-decoration:none}
.icon-b .dot{position:absolute;top:4px;right:2px;min-width:16px;height:16px;font-size:10px;font-weight:600;background:var(--fg);color:var(--bg);border-radius:8px;padding:0 4px;line-height:16px;text-align:center}
.me{width:34px;height:34px;margin-left:6px;border-radius:50%;background:var(--fg);color:var(--bg);font-size:12px;font-weight:600;border:0;cursor:pointer}
.drawer{max-width:440px;margin-left:auto}
.subnav{display:flex;gap:4px;margin:-12px 0 32px;border-bottom:1px solid var(--line);overflow-x:auto}
.subnav a{padding:10px 14px;font-size:14px;color:var(--muted);text-decoration:none;white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px}
.subnav a.on{color:var(--fg);font-weight:600;border-color:var(--fg)}
.tabbar a{position:relative}
.tabbar a.on::before{content:"";position:absolute;top:-1px;left:32%;right:32%;height:2px;background:var(--fg)}
@media (max-width:960px){
 .desk{display:none!important}
 .menu-btn{display:inline-flex;align-items:center}
 .top-in{justify-content:space-between;flex-wrap:nowrap}
 .tabbar{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--bg);border-top:1px solid var(--line);box-shadow:none;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
 .tabbar a,.tabbar button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 2px 8px;font-size:11px;font-weight:500;text-decoration:none;color:var(--faint);background:none;border:0;cursor:pointer;min-width:0}
 .tabbar span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
 .tabbar .on{color:var(--fg)}
 main{padding-bottom:calc(120px + env(safe-area-inset-bottom,0px))}
 .toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
 .h-xl{font-size:clamp(34px,10vw,56px)}
 .lead{font-size:17px}
}
@media (max-width:640px){.rub{grid-template-columns:1fr 1fr 30px}.box{padding:20px}
 .planta{min-width:0;grid-template-rows:repeat(3,minmax(124px,auto));gap:5px;padding:5px}
 .amb{padding:8px;gap:6px}
 .amb h3{font-size:12.5px;line-height:1.2}
 .amb .mono.tag{display:none}
 .amb .mono{font-size:10px;letter-spacing:.06em}
 .av{width:28px;height:28px;font-size:10px;border-width:1px}
 .av .st{width:9px;height:9px}
 .avs{gap:4px}
 .amb .btn.small{min-height:30px;padding:0 10px;font-size:12px}
 .layout-sala{gap:24px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@keyframes pulse{50%{opacity:.35}}
.loading{animation:pulse 1s ease-in-out infinite}

/* ===== Proposta leve: canvas cinza claro, cartões brancos arredondados, navegação lateral ===== */
:root{--canvas:#F4F5F7;--fg:#16181D;--inv-bg:#16181D;--muted:#666A72;--faint:#8E929A;--line:#E6E7EA;--soft:#F1F2F4;--ctl:#DADCE0;--shadow:0 1px 2px rgba(16,24,40,.05)}
body{background:var(--canvas);font-size:15px}
[style*="solid var(--fg)"]{border-color:var(--line)!important}
.mono{font-size:11.5px;font-weight:600;letter-spacing:.06em;color:var(--faint)}
.h-xl{font-size:clamp(28px,3.4vw,40px);font-weight:700;letter-spacing:-.02em;line-height:1.15}
.h-l{font-size:clamp(24px,2.6vw,32px);font-weight:700;letter-spacing:-.015em;line-height:1.2}
.h-m{font-size:19px;font-weight:600;letter-spacing:-.005em}
.lead{font-size:16px}
.score{font-size:44px;font-weight:700}
.box{background:var(--bg);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.soft{background:var(--soft);border-radius:12px}
.list{background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:0 20px;box-shadow:var(--shadow)}
.list>*{border-top:1px solid var(--line)}
.list>*:first-child{border-top:0}.list>*:last-child{border-bottom:0}
.box .list,.soft .list,.drawer .list{background:none;border:0;padding:0;box-shadow:none;border-radius:0}
.btn{border-radius:10px;border:1px solid var(--ctl);background:var(--bg);min-height:42px;font-weight:600;font-size:14px;padding:0 18px;transition:border-color .15s,background .15s}
.btn:hover{border-color:#B9BCC2}
.btn.dark{background:var(--fg);border-color:var(--fg);color:#fff}
.btn.dark:hover{background:#2B2E35}
.btn.small{min-height:34px;border-radius:9px;font-size:13px;padding:0 12px}
.btn[disabled]{border:1px dashed var(--ctl);background:var(--soft);color:var(--faint)}
textarea,input[type=text],input[type=password],input[type=file],select.f{border:1px solid var(--ctl);border-radius:10px;background:var(--bg)}
textarea:focus,input:focus,select:focus{border-color:var(--fg);outline:none}
.search{border:1px solid var(--ctl);border-radius:10px;background:var(--bg);overflow:hidden}
.search button{border-left:0}
.role{border:0;border-radius:999px;padding:3px;background:var(--soft);display:inline-flex}
.role button{border-radius:999px;font-weight:600;color:var(--muted)}
.role button.on{background:var(--bg);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.pill{border:0;background:#ECEEF1;color:#3A3D42;border-radius:999px;padding:3px 10px;font-weight:600;letter-spacing:.02em;text-transform:none;font-size:12px;font-family:var(--body)}
.pill.inv{background:var(--fg);color:#fff}
.pill.dash{background:transparent;border:1px dashed #C4C7CC;color:var(--muted)}
.badge{border-radius:999px;padding:0 7px;font-family:var(--body);font-weight:600}
.tabs{display:inline-flex;flex-wrap:wrap;gap:2px;background:#E9EAED;padding:4px;border-radius:12px}
.tabs button{border:0;border-radius:9px;background:transparent;min-height:36px;font-weight:600;font-size:14px;color:var(--muted)}
.tabs button.on{background:var(--bg);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.subnav{display:inline-flex;max-width:100%;gap:2px;background:#E9EAED;padding:4px;border-radius:12px;border:0;margin:0 0 28px}
.subnav a{border:0;border-radius:9px;margin:0;padding:8px 16px;font-weight:600;font-size:14px}
.subnav a.on{background:var(--bg);box-shadow:0 1px 3px rgba(0,0,0,.1);border:0}
.video{border-radius:16px;overflow:hidden}
.opt{border-radius:12px;border:1px solid var(--line);background:var(--bg)}
.opt.sel{border:1.5px solid var(--fg);background:var(--soft)}
.opt.ok{border:1.5px solid var(--fg)}
.opt.no{border:1.5px dashed var(--fg)}
.aside-list button{border-bottom:1px solid var(--line)}
.aside-list button.on{border-radius:10px}
.layout-aula aside{background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:var(--shadow)}
.block{background:var(--bg);border-radius:12px;border:1px solid var(--line)}
.icon-btns button{border-radius:8px;border:1px solid var(--line)}
.tbl{background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:4px 8px;box-shadow:var(--shadow)}
th{border-bottom:1px solid var(--line)}
.planta{background:#22252B;border-radius:14px;gap:6px;padding:6px}
.amb{border-radius:8px}
.amb.aqui{outline:2.5px solid var(--fg)}
.toast{border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.av{background:var(--bg)}
header.top{background:var(--bg);border-bottom:1px solid var(--line)}
.drawer{background:var(--bg)}
.drawer a.dl{font-size:16px}
.chk{border-bottom:1px solid var(--line)}
@media (min-width:961px){
 header.top{position:fixed;top:0;left:0;bottom:0;width:248px;border-right:1px solid var(--line);border-bottom:0;z-index:20}
 header.top>#top{padding:0 14px;height:100%;max-width:none;display:flex;flex-direction:column;position:relative}
 .top-in{flex-direction:column;align-items:stretch;gap:4px;height:100%;padding-block:24px 16px;min-height:0}
 .brand{padding:0 10px 22px}
 .nav{flex-direction:column;gap:2px;flex:1}
 .nav a{height:42px;padding:0 12px;border-radius:10px;gap:12px;font-size:14px;font-weight:500;color:var(--muted)}
 .nav a svg{width:20px;height:20px}
 .nav a.on{background:var(--soft);color:var(--fg);font-weight:600}
 .nav a.on::after{display:none}
 .nav a:hover{background:var(--soft)}
 .hd-ic{margin:0;padding-top:12px;border-top:1px solid var(--line);justify-content:flex-start}
 .hd-ic .me{margin-left:auto}
 .drawer{position:absolute;left:258px;bottom:16px;width:320px;max-width:none;border:1px solid var(--line);border-radius:16px;box-shadow:0 16px 40px rgba(16,24,40,.14);padding:18px}
 main.wrap{margin-left:248px;max-width:none;padding-left:max(44px,env(safe-area-inset-left,0px));padding-right:max(44px,env(safe-area-inset-right,0px));padding-block:40px 96px}
 main.wrap>*{max-width:1180px}
}
@media (max-width:960px){
 header.top{border-bottom:1px solid var(--line)}
 .tabbar{background:var(--bg)}
 .tabbar a.on::before{display:none}
 .tabbar a.on svg{stroke-width:2}
 .list{padding:0 16px}

}

  const linhas=[['cri','Qualidade de criação','só você avalia'],['tec','Qualidade técnica','IA sugere '+f1(sug.tec)],['pad','Aderência ao padrão EZE','IA: conformidade '+sc+'%'],['prazo','Prazo combinado','entregue no prazo'],['rev','Revisões necessárias',e.tent+' pré-revisões']];

   <div><p class="mono" style="margin:0 0 6px">Sua avaliação</p>${linhas.map(l=>`<div class="rub"><label for="r-${l[0]}"><span style="font-weight:500">${l[1]}</span><br><span class="note">${l[2]}</span></label><input type="range" min="1" max="5" step="0.5" id="r-${l[0]}" data-rub="${l[0]}" value="${R[l[0]]}"><span id="v-${l[0]}" style="font-weight:600">${f1(R[l[0]])}</span></div>`).join('')}
   <div class="row" style="align-items:flex-end;justify-content:space-between;margin:16px 0"><span class="mono">Nota final</span><span class="score" id="nf">${f1(nota)}</span></div>

 el.querySelector('#somb').setAttribute('height',(16+150*(1-alt)).toFixed(1));el.querySelector('#somb').setAttribute('opacity',(day?.24:0).toFixed(2));

 capaRAF=requestAnimationFrame(capaFrame);

}
function render(){
 fixSala();let v=view();const adm=S.role==='admin';const sess=ses('s');
 if(sess==='cliente')v='visita';else if(!sess)v='entrar';
 document.body.classList.toggle('bare',v==='entrar'||v==='visita'||v==='previa');document.body.classList.toggle('cover',v==='entrar'||v==='previa');
 if(adm&&['entregas','perfil'].includes(v))v='inicio';if(!adm&&['avaliar','contratar','conteudo','config','previa'].includes(v))v='inicio';
 renderTop();
 const map={inicio:vInicio,sala:vSala,entregas:vEntregas,perfil:vPerfil,credenciamento:vCred,aula:vAula,avaliar:vAvaliar,contratar:vContratar,conteudo:vConteudo,manual:vManual,mural:vMural,busca:vBusca,projetos:vProjetos,entrar:vEntrada,visita:vVisita,config:vConfig,previa:()=>`<a class="previa-bar" href="#config">Pré-visualização da página de entrada · Voltar às configurações</a>`+vEntrada()};
 const g=groupOf(v);document.getElementById('app').innerHTML=(g&&g.subs.length>1&&v!=='aula'?subnav(g,v):'')+(map[v]||vInicio)();
 erro='';save();startCapa();
}
function stopVideo(){if(timer){clearInterval(timer);timer=null}}

 {const vv=S.visitas&&S.visitas.find(x=>x.id==(el.dataset.id||ses('vis')));

 if(act==='concluir'){a.done=true;render();toast(S.aula===5?'Credenciado em Projeto de aprovação':'Aula concluída');return}
 if(act==='lido'){const x=S.avisos.find(x=>x.id==el.dataset.id);x.lido=true;x.conf=Math.min(5,x.conf+1);render();toast('Leitura confirmada');return}
 if(act==='baixar'){toast('No sistema real, o arquivo é baixado aqui');return}

 if(act==='iniciarReu'||act==='entrarReu'){const id=el.dataset.id;if(act==='iniciarReu')S.reunioes.push({proj:id});me.sala='reuniao';S.chamada=true;S.mudo=false;go('sala');window.scrollTo(0,0);toast(act==='iniciarReu'?'Reunião iniciada na Sala de reunião. Os Partners do projeto foram avisados.':'Você entrou na reunião');return}
 if(act==='entrar'){me.sala=el.dataset.id;render();toast('Você entrou em '+AMB.find(x=>x.id===me.sala).t);return}
 if(act==='audio'){S.chamada=true;S.mudo=false;render();return}

 if(act==='mudo'){S.mudo=!S.mudo;render();return}

 if(act==='pessoa'||act==='bater'){const p=S.pjs.find(x=>x.id===el.dataset.id);if(p.id===me.id)return;toast(p.st==='foco'?`${p.nome} está focado. Recado enviado.`:`Chamando ${p.nome} (${p.cidade}, ${hora(p.cidade)})`);return}
 if(act==='aceitar'){S.convite.st='aceito';eu().ativos++;AMB.find(x=>x.id==='p-mar');render();toast('Contrato aceito');return}
 if(act==='recusar'){S.convite.st='recusado';render();toast('Convite recusado');return}
 if(act==='ap'){const id=+el.dataset.id;if(!e.ok.includes(id))e.okPend=(e.okPend||[]);const i=(e.okPend||[]).indexOf(id);if(el.checked){if(i<0)e.okPend.push(id)}else if(i>=0)e.okPend.splice(i,1);save();return}
 if(act==='reenviar'){if(!(e.okPend||[]).length){toast('Marque o que você corrigiu antes de reenviar');return}e.st='analisando';render();setTimeout(()=>{e.ok=[...new Set(e.ok.concat(e.okPend))];e.okPend=[];e.tent++;e.score=scoreIA();e.st='revisada';render();toast('Nova pré-revisão: '+e.score+'%')},1600);return}
 if(act==='enviarEze'){e.st='enviada';S.rub=null;render();toast('Entrega enviada ao Eze');return}
 if(act==='exok'){S.a[5].ex='aprovado';S.a[5].com=document.getElementById('excom').value.trim();render();toast('Exercício aprovado');return}
 if(act==='exno'){const c=document.getElementById('excom').value.trim();if(!c){erro='excom';render();return}S.a[5].ex='devolvido';S.a[5].com=c;render();toast('Exercício devolvido');return}
 if(act==='publicarAv'){const nota=recalc();const p=eu();e.nota=Math.round(nota*10)/10;e.com=document.getElementById('acom').value.trim();e.st='avaliada';p.hab.criacao=Math.round(((p.hab.criacao*p.n.criacao)+e.nota)/(p.n.criacao+1)*10)/10;p.n.criacao++;render();toast('Avaliação publicada. Nova média de Criação: '+f1(p.hab.criacao));return}
 if(act==='atribuir'){const d=S.dem||{proj:'',hab:'aprovacao',prazo:''};if(!d.proj.trim()){erro='dem';render();return}const p=S.pjs.find(x=>x.id===el.dataset.id);S.demandas.push({proj:d.proj,hab:d.hab,pj:p.nome,st:'aguardando'});S.dem={proj:'',hab:d.hab,prazo:''};render();toast('Convite enviado a '+p.nome);return}
 if(act==='leg'){S.base.leg[+el.dataset.i][2]='Regras extraídas';render();toast('Plano diretor processado pela IA (simulado)');return}

 const bl=['badd','bdel','bup','bdown'].includes(act)?curBlocos():[],i=+el.dataset.i;

document.addEventListener('change',ev=>{
 const t=ev.target;
 if(t.dataset.act==='ck'){S.a[S.aula].ck[+t.dataset.i]=t.checked;render();return}
 if(t.dataset.act==='ap')return;
 if(t.id==='rec'){S.ed.rec=t.checked;save()}
 if(t.id==='cfgTempo'){capaCfg().tempo=+t.value;if(slideTimer){clearInterval(slideTimer);slideTimer=null}save();toast('Tempo de troca atualizado');return}
 if(t.id==='cfgAleat'){capaCfg().aleatorio=t.checked;save();return}
 if(t.id==='cfgPb'){capaCfg().pb=t.checked;render();return}
 if(t.id==='cfgNova'){const files=[...(t.files||[])];if(!files.length)return;let ok=0;const next=k=>{if(k>=files.length){render();toast(ok?ok+(ok>1?' imagens adicionadas':' imagem adicionada'):'Não foi possível adicionar');return}const rd=new FileReader();rd.onload=()=>{const im=new Image();im.onload=()=>{const w=Math.min(1600,im.width),h=Math.round(im.height*w/im.width);const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);SL().push({url:c.toDataURL('image/jpeg',.78),x:50,xm:50});if(cfgSave())ok++;else{SL().pop();toast('Sem espaço no protótipo. Remova alguma imagem antes.');render();return}next(k+1)};im.onerror=()=>next(k+1);im.src=rd.result};rd.readAsDataURL(files[k])};next(0);return}
 if(t.id==='pf'){S.pf=t.value;render();return}
 if(t.id==='foto'||t.id==='foto2'){const file=t.files&&t.files[0];if(!file)return;const rd=new FileReader();rd.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=160;const x=c.getContext('2d');const m=Math.min(im.width,im.height);x.drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,160,160);S.fotos=S.fotos||{};S.fotos[S.role==='admin'?'eze':'eu']=c.toDataURL('image/jpeg',.82);render();toast('Foto atualizada')};im.src=rd.result};rd.readAsDataURL(file);return}
 if(t.id==='meust'){S.pjs.find(p=>p.id===(S.role==='admin'?'eze':'eu')).st=t.value;render()}
 if(t.id==='dhab'){S.dem=S.dem||{proj:'',prazo:''};S.dem.hab=t.value;render()}
});
document.addEventListener('input',ev=>{
 const t=ev.target;
 if(t.dataset.fx!==undefined||t.dataset.fm!==undefined){const i=+(t.dataset.fx??t.dataset.fm),f=SL()[i];if(t.dataset.fx!==undefined)f.x=+t.value;else f.xm=+t.value;const im=t.closest('.cfg-foto').querySelector('img');im.style.objectPosition=t.value+'% 50%';save();return}
 if(t.id==='pq'){S.pq=t.value;render();const e=document.getElementById('pq');if(e){e.focus();e.setSelectionRange(e.value.length,e.value.length)}return}

 if(t.id==='at_t'){S.estr[S.sel.tri].aulas[S.sel.au].t=t.value;save()}
 if(t.dataset.bloco!==undefined){curBlocos()[+t.dataset.bloco].v=t.value;save()}
 if(t.dataset.rub){S.rub[t.dataset.rub]=+t.value;document.getElementById('v-'+t.dataset.rub).textContent=f1(+t.value);recalc();save()}
 if(t.id==='dproj'||t.id==='dprazo'){S.dem=S.dem||{hab:'aprovacao'};S.dem.proj=document.getElementById('dproj').value;S.dem.prazo=document.getElementById('dprazo').value;save()}

document.addEventListener('submit',ev=>{
 ev.preventDefault();const f=ev.target;const e=S.entrega;
 if(f.id==='flogin'){const m=document.getElementById('lmail').value.trim();if(!m){erro='login';render();return}ses('s','equipe');location.hash='inicio';render();toast('Bem-vindo ao escritório');return}

 if(f.dataset.busca){S.busca=f.querySelector('input').value;menuOpen=false;go('busca');return}
 if(f.id==='fduv'){const v=document.getElementById('duv').value.trim();if(!v){erro='duv';render();return}S.duv.push({id:Date.now(),aula:S.aula,quem:'Você',txt:v,resp:'',faq:false});render();toast('Dúvida enviada');return}
 if(f.id==='fex'){const inp=document.getElementById('arq');if(!inp.files.length){erro='ex';render();return}S.a[5].ex='enviado';S.a[5].arq=inp.files[0].name;render();toast('Exercício enviado para correção');return}

 if(f.id==='frec'){const v=document.getElementById('rtxt').value.trim();if(!v){erro='rec';render();return}const id=f.dataset.id;(S.recados[id]=S.recados[id]||[]).push({quem:S.role==='admin'?'Eze':'Você',d:'agora',txt:v});render();toast('Recado enviado');return}
 if(f.id==='ftri'){const v=document.getElementById('ntri').value.trim();if(!v){erro='tri';render();return}S.estr.push({t:v,hab:'Habilidade',aulas:[{t:'Nova aula',blocos:[{t:'video',v:''},{t:'texto',v:''}]}]});S.sel={tri:S.estr.length-1,au:0};render();toast('Trilha criada');return}
 if(f.id==='fdem')return;
 if(f.id==='faviso'){const t=document.getElementById('at').value.trim();if(!t){erro='aviso';render();return}S.avisos.unshift({id:Date.now(),t,x:document.getElementById('ax').value.trim(),d:'hoje',lido:false,conf:0});render();toast('Aviso publicado');return}
 if(f.dataset.form==='resp'){const id=+f.dataset.id;const r=document.getElementById('r'+id).value.trim();if(!r){erro='r'+id;render();return}const d=S.duv.find(d=>d.id===id);d.resp=r;d.faq=document.getElementById('f'+id).checked;render();toast('Resposta enviada');return}
});
document.addEventListener('click',ev=>{if(ev.target.closest('.drawer a.dl')&&menuOpen){menuOpen=false;setTimeout(renderTop,0)}});

window.addEventListener('hashchange',()=>{stopVideo();menuOpen=false;render();window.scrollTo(0,0)});
setInterval(()=>{if(view()==='sala'&&!document.activeElement.matches('select,input,textarea'))render()},60000);
fixSala();render();
